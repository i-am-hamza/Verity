<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://rsms.me" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Verity — ESG disclosure dashboard</title>
    <script>
      /* Pre-boot theme setter: puts the right theme class on <html> before
         React mounts, so there is no dark-flash on a light-themed system
         (or vice versa). Mirrors the readInitialTheme logic in
         src/store/theme.ts; both must agree on initial state. */
      (function () {
        try {
          var stored = window.localStorage.getItem("verity.theme");
          var theme = stored === "dark" || stored === "light"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light");
          document.documentElement.classList.add("theme-" + theme);
        } catch (e) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
