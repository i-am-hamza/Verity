[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "storage", "tessdata", "alembic/versions"]

[tool.ruff.lint]
# Pragmatic starter set: real bug/hygiene checks, no style bikeshedding.
# E/F/W: pyflakes+pycodestyle basics. I: import order. B: bugbear.
# UP: pyupgrade. SIM: simplifications. RUF: ruff-specific.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line length — handled by formatter, not worth breaking prose comments
    "B008",  # allow FastAPI Depends(...) in defaults
    "UP007", # allow Optional[X] etc for readability
    "SIM108",# ternary vs if/else — style pref, not a bug
]

[tool.mypy]
# 3.12 so mypy accepts PEP 695 `type` statements in third-party stubs (numpy 2.5).
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
# Pragmatic strictness: catches real bugs without demanding stubs for every dep.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# SQLAlchemy declarative models make full strictness noisy; enable it per-file
# once model type stubs are in place.

[[tool.mypy.overrides]]
module = ["pymupdf", "fitz", "pytesseract", "PIL.*", "spacy.*", "bs4", "seed.*", "scripts.*", "openpyxl.*", "alembic.*"]
ignore_missing_imports = true
follow_imports = "skip"
